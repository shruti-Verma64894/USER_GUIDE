name: Pipeline 1 - Frontend Crawler

on:

  schedule:

    - cron: '30 18 * * *' # 12:00 AM IST

  workflow_dispatch:       # Manual test button

jobs:

  crawl-portals:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    container:

      image: mcr.microsoft.com/playwright:v1.65.1-noble

      options: --cap-add=NET_ADMIN --device=/dev/net/tun

    steps:

      - name: Checkout Crawler Repo

        uses: actions/checkout@v4

      - name: Install jq (Fast)

        run: |

          curl -sL https://github.com/jqlang/jq/releases/latest/download/jq-linux-amd64 -o /usr/local/bin/jq

          chmod +x /usr/local/bin/jq

      - name: Install Dependencies

        run: npm ci

      - name: Connect to OpenVPN

        env:

          VPN_CONFIG_BASE64: ${{ secrets.VPN_CONFIG_BASE64 }}

          VPN_USERNAME: ${{ secrets.VPN_USERNAME }}

          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}

        run: |

          apt-get update && apt-get install -y openvpn iproute2

          echo "$VPN_CONFIG_BASE64" | base64 -d > /tmp/client.ovpn

          if [ -n "$VPN_USERNAME" ] && [ -n "$VPN_PASSWORD" ]; then

            printf "%s\n%s\n" "$VPN_USERNAME" "$VPN_PASSWORD" > /tmp/auth.txt

            chmod 600 /tmp/auth.txt

            openvpn --config /tmp/client.ovpn --auth-user-pass /tmp/auth.txt --daemon --log /tmp/openvpn.log

          else

            openvpn --config /tmp/client.ovpn --daemon --log /tmp/openvpn.log

          fi

          # Wait up to 30s for the VPN tunnel (tun0) to come up

          for i in $(seq 1 15); do

            if ip link show tun0 >/dev/null 2>&1; then

              echo "OpenVPN connected successfully (tun0 is up)."

              break

            fi

            sleep 2

          done

          if ! ip link show tun0 >/dev/null 2>&1; then

            echo "OpenVPN failed to connect. Logs:"

            cat /tmp/openvpn.log

            exit 1

          fi

      - name: Run Playwright Crawler

        env:

          PUBLIC_URL: ${{ vars.PUBLIC_URL }}

          ADMIN_URL: ${{ vars.ADMIN_URL }}

          CLIENT_URL: ${{ vars.CLIENT_URL }}

          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}

          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

          CLIENT_USERNAME: ${{ secrets.CLIENT_USERNAME }}

          CLIENT_PASSWORD: ${{ secrets.CLIENT_PASSWORD }}

        run: xvfb-run --auto-servernum node crawler.js

      - name: Disconnect OpenVPN

        if: always()

        run: |

          pkill openvpn || true

          rm -f /tmp/client.ovpn /tmp/auth.txt /tmp/openvpn.log

      - name: Normalize JSON & Push to Central Docs Repo

        id: push_data

        run: |

          git clone https://x-access-token:${{ secrets.CENTRAL_REPO_PAT }}@github.com/harshh122/central-docs-hub.git central-docs

          mkdir -p central-docs/data/inbox/portal-1/frontend

          find output -name "*.json" | while read -r file; do

            rel_path="${file#output/}"

            mkdir -p "central-docs/data/inbox/portal-1/frontend/$(dirname "$rel_path")"

            jq -S -c . "$file" > "central-docs/data/inbox/portal-1/frontend/$rel_path"

          done

          cd central-docs

          git config user.name "github-actions[bot]"

          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/inbox/portal-1/frontend

          if git diff --staged --quiet; then

            echo "No JSON changes for portal-1."

            echo "changed=false" >> $GITHUB_OUTPUT

          else

            git commit -m "chore: update portal-1 frontend JSON"

            git push

            echo "changed=true" >> $GITHUB_OUTPUT

          fi

      - name: Trigger Central Hub (Pipeline 3)

        if: steps.push_data.outputs.changed == 'true'

        uses: peter-evans/repository-dispatch@v3

        with:

          token: ${{ secrets.CENTRAL_REPO_PAT }}

          repository: harshh122/central-docs-hub

          event-type: json-data-updated

          client-payload: '{"portal": "portal-1", "source": "frontend"}'
